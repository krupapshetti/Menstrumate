<!DOCTYPE html>
<html>
<head>
  <title>Shop</title>

  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }
    h1 { margin-bottom: 20px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .box, .product {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .product img {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: black;
      color: white;
    }

    #back { display: none; margin-bottom: 20px; }
  </style>
</head>

<body>

<h1>Shop Essentials</h1>

<button id="back" onclick="showCategories()">⬅ Back</button>
<button onclick="goToCart()">🛒 Go to Cart</button>

<div id="content" class="grid"></div>

<script>

const categories = {
  "Core Products": [
    { name: "Sanitary Pads", price: 100, img: "https://i.pinimg.com/736x/0e/a0/48/0ea048773c714e36cae82853b5b09c07.jpg" },
    { name: "Tampons", price: 150, img: "https://i.pinimg.com/1200x/0c/bc/20/0cbc202457722335e09e7192fa961da2.jpg" },
    { name: "Menstrual Cup", price: 300, img: "https://i.pinimg.com/736x/e0/70/3e/e0703eb4f3e53232f11095e2aebee470.jpg" }
  ],
  "Pain Relief": [
    { name: "Heating Pad", price: 500, img: "https://i.pinimg.com/1200x/e1/11/2b/e1112b7937cca9431838df38904b77d5.jpg" },
    { name: "Pain Patch", price: 250, img: "https://i.pinimg.com/736x/5a/7c/a1/5a7ca10fd45521ba429d6cf18cb2498c.jpg" }
  ],
  "Comfort": [
    { name: "Chocolate", price: 120, img: "https://i.pinimg.com/736x/73/d8/af/73d8af5e270d5aa30e0b6d1df6224ebe.jpg" },
    { name: "Herbal Tea", price: 200, img: "https://i.pinimg.com/1200x/e5/80/33/e58033fa7f8c3874b771ec1f0b9a9b10.jpg" }
  ]
};

function showCategories() {
  const content = document.getElementById("content");
  document.getElementById("back").style.display = "none";
  content.innerHTML = "";

  Object.keys(categories).forEach(cat => {
    content.innerHTML += `
      <div class="box" onclick="showProducts('${cat}')">
        <h3>${cat}</h3>
      </div>
    `;
  });
}

function showProducts(cat) {
  const content = document.getElementById("content");
  document.getElementById("back").style.display = "block";
  content.innerHTML = "";

  categories[cat].forEach(item => {
    content.innerHTML += `
      <div class="product">
        <img src="${item.img}">
        <h4>${item.name}</h4>
        <p>₹${item.price}</p>
        <button onclick='addToCart(${JSON.stringify(item)})'>Add</button>
      </div>
    `;
  });
}

function addToCart(item) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  let existing = cart.find(i => i.name === item.name);

  if (existing) existing.qty++;
  else {
    item.qty = 1;
    cart.push(item);
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart");
}

function goToCart() {
  window.location.href = "cart.html";
}

showCategories();

</script>

</body>
</html>
