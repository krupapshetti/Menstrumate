<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>

  <style>
    body { font-family: Arial; background: #f5f5f5; padding: 20px; }

    .container { display: flex; gap: 20px; }

    .cart, .summary {
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .cart { flex: 3; }
    .summary { flex: 1; }

    .item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    img { width: 60px; }

    #paymentBox {
      display: none;
      position: fixed;
      top: 20%;
      left: 40%;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>Checkout</h1>

<div class="container">
  <div class="cart" id="cartItems"></div>

  <div class="summary">
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="showQR()">Pay Now</button>
  </div>
</div>

<div id="paymentBox">
  <h3>Scan to Pay</h3>
  <img src="/qr.jpeg">
  <br>
  <button onclick="confirmPayment()">Done</button>
</div>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function render() {
  let html = "";
  let total = 0;

  cart.forEach(item => {
    total += item.price * item.qty;

    html += `
      <div class="item">
        <img src="${item.img}">
        <div>${item.name}</div>
        <div>₹${item.price}</div>
      </div>
    `;
  });

  document.getElementById("cartItems").innerHTML = html;
  document.getElementById("total").innerText = total;
}

function showQR() {
  document.getElementById("paymentBox").style.display = "block";
}

function confirmPayment() {
  fetch('/api/payment/confirm', { method: 'POST' })
  .then(res => res.json())
  .then(data => {
    alert(data.message);
    localStorage.removeItem("cart");
    window.location.href = "shop.html";
  });
}

render();

</script>

</body>
</html>
