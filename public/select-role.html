<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Role | Menstrumate</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="role-select-page">
    <section class="role-select-shell">
      <a class="back-link" href="/">Back</a>
      <p class="landing-kicker">Choose your login</p>
      <h1>Welcome back</h1>
      <div class="title-accent"></div>
      <p class="landing-subtitle">Select how you want to continue</p>

      <div class="role-select-grid">
        <article class="role-select-card">
          <h2>Login as User</h2>
          <p>Track your cycle, wellness, shop, diet plan, yoga, and doctor chat.</p>
          <a class="btn role-select-btn" href="/?auth=login&role=user">Continue as User</a>
        </article>

        <article class="role-select-card">
          <h2>Login as Doctor</h2>
          <p>Review patient messages, alerts, recommendations, and dashboard insights.</p>
          <a class="btn secondary role-select-btn" href="/?auth=login&role=doctor">Continue as Doctor</a>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
