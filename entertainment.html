<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entertainment</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎬 Entertainment Hub</h1>

<div class="page-container">

    <!-- YouTube Search -->
    <div class="content-box">

        <h2>🔍 Search YouTube</h2>

        <input 
            type="text" 
            id="youtubeSearch" 
            placeholder="Search videos..."
        >

        <button onclick="searchYouTube()">
            Search
        </button>

    </div>

    <!-- Music -->
    <div class="content-box">

        <h2>🎧 Relaxing Music</h2>

        <iframe 
            width="100%" 
            height="250"
            src="https://www.youtube.com/embed/jfKfPfyJRdk"
            frameborder="0"
            allowfullscreen>
        </iframe>

    </div>

    <!-- Games -->
    <div class="content-box">

        <h2>🎮 Games</h2>

        <a 
            href="https://www.chess.com/play/computer" 
            target="_blank"
        >
            ♟️ Play Chess
        </a>

        <a 
            href="https://www.crazygames.com/game/ludo-king" 
            target="_blank"
        >
            🎲 Play Ludo
        </a>

        <a 
            href="https://www.crazygames.com/game/carrom-clash" 
            target="_blank"
        >
            🪵 Play Carrom
        </a>

    </div>

    <!-- Books -->
    <div class="content-box">

        <h2>📚 Books & Novels</h2>

        <a 
            href="https://www.gutenberg.org/" 
            target="_blank"
        >
            📖 Read Free Novels
        </a>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
